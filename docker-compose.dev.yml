services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    tmpfs:
      - /app/vendor:exec
    volumes:
      - ./:/app
    working_dir: /app/
    # The vendor tree is in memory, so it goes with the container and is fetched again on start.
    command: sh -c "composer install --no-interaction && sleep infinity"
